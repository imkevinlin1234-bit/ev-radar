<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>充電站雷達</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="充電站雷達">
<link rel="stylesheet" href="./vendor/leaflet.css">
<style>
/* 版面：全螢幕地圖＋上方篩選列＋下方可拉高的清單／詳細面板 */
:root {
  --bg: #F4F5F9; --surface: #FFFFFF; --surface-2: #EEF0F5; --ink: #0E1116; --ink-2: #3B4252; --ink-3: #687083;
  --line: #E1E4EC; --accent: #2B54FF; --accent-soft: #E6ECFF; --on-accent: #FFFFFF;
  --ok: #087F50; --ok-soft: #DDF5E9; --warn: #B45A00; --warn-soft: #FFF1DE; --bad: #C8102E; --bad-soft: #FDE4E8;
  /* 充電站分類色（地圖、清單、圖例共用） */
  --c-tesla: #E31937; --c-ultra: #7C3AED; --c-fast: #EA580C; --c-slow: #16A34A; --c-unk: #6B7280;
  --shadow: 0 1px 2px rgba(14,17,22,.06), 0 8px 24px rgba(14,17,22,.14);
  --font: "Noto Sans TC", "PingFang TC", "Heiti TC", "Microsoft JhengHei", system-ui, sans-serif;
  --num: "SF Pro Rounded", ui-rounded, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1016; --surface: #171B23; --surface-2: #222833; --ink: #F1F3F8; --ink-2: #C3C8D4; --ink-3: #8D94A5;
  --line: #2A303C; --accent: #6F8BFF; --accent-soft: #1E2A55; --on-accent: #0D1016;
  --ok: #4CD39A; --ok-soft: #123326; --warn: #FFB25C; --warn-soft: #3A2810; --bad: #FF6B81; --bad-soft: #3A1520;
  --c-tesla: #FF3B55; --c-ultra: #A78BFA; --c-fast: #FB923C; --c-slow: #4ADE80; --c-unk: #9CA3AF; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1016; --surface: #171B23; --surface-2: #222833; --ink: #F1F3F8; --ink-2: #C3C8D4; --ink-3: #8D94A5;
  --line: #2A303C; --accent: #6F8BFF; --accent-soft: #1E2A55; --on-accent: #0D1016;
  --ok: #4CD39A; --ok-soft: #123326; --warn: #FFB25C; --warn-soft: #3A2810; --bad: #FF6B81; --bad-soft: #3A1520;
  --c-tesla: #FF3B55; --c-ultra: #A78BFA; --c-fast: #FB923C; --c-slow: #4ADE80; --c-unk: #9CA3AF; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100%; margin: 0; overflow: hidden }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font); -webkit-text-size-adjust: 100% }
button { font: inherit; color: inherit; cursor: pointer }
.n { font-family: var(--num); font-variant-numeric: tabular-nums }
#map { position: fixed; inset: 0; background: var(--surface-2) }
.leaflet-container { font: inherit; background: var(--surface-2) }
/* 深色模式：把 OSM 底圖反轉成深色，道路與文字仍看得清楚 */
.darkmap .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.9) saturate(.6) }
.leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--surface) 80%, transparent) !important; color: var(--ink-3) }
.leaflet-control-attribution a { color: var(--ink-2) }

/* 上方：狀態列＋分類篩選 */
.top { position: fixed; z-index: 900; left: 0; right: 0; top: 0; pointer-events: none;
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 8px }
.row { display: flex; gap: 8px; align-items: center }
.pill { pointer-events: auto; background: var(--surface); border: 0; border-radius: 999px; padding: 7px 12px; box-shadow: var(--shadow);
  font-size: 13px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; min-height: 36px }
.status { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; justify-content: flex-start }
.status .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none }
.status.on .live { background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 1.8s infinite }
.status span.t { overflow: hidden; text-overflow: ellipsis }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent) } 70% { box-shadow: 0 0 0 8px transparent } 100% { box-shadow: 0 0 0 0 transparent } }
.iconbtn { width: 38px; height: 38px; padding: 0; justify-content: center; font-size: 17px; flex: none }
.chips { pointer-events: auto; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin: 0 -12px; padding-inline: 12px }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; border: 1.5px solid transparent; background: var(--surface); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 11px;
  font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; color: var(--ink-2) }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block }
.chip .cnt { color: var(--ink-3); font-weight: 600 }
.chip[aria-pressed="false"] { opacity: .5; box-shadow: none; background: color-mix(in srgb, var(--surface) 75%, transparent) }
.chip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 2px var(--c) }
.here { pointer-events: auto; align-self: center; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 8px 16px;
  font-weight: 700; font-size: 13px; box-shadow: var(--shadow) }

/* 右側：定位按鈕 */
.fab { position: fixed; z-index: 900; right: max(12px, env(safe-area-inset-right, 0px)); width: 46px; height: 46px; border-radius: 50%; border: 0;
  background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; font-size: 19px; transition: bottom .25s }
.fab.follow { background: var(--accent); color: var(--on-accent) }

/* 下方面板 */
.sheet { position: fixed; z-index: 950; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 18px 18px 0 0;
  box-shadow: 0 -6px 28px rgba(14,17,22,.18); display: flex; flex-direction: column; height: var(--h, 40vh); max-height: calc(100% - 64px);
  transition: height .25s ease; padding-bottom: env(safe-area-inset-bottom, 0px) }
.sheet.drag { transition: none }
@media (min-width: 860px) { .sheet { left: max(12px, env(safe-area-inset-left, 0px)); right: auto; width: 400px; bottom: 12px; top: 112px; height: auto !important;
  max-height: none; border-radius: 18px } .grab { display: none } .fab { bottom: 24px !important } }
.grab { flex: none; padding: 8px 0 4px; display: grid; place-items: center; touch-action: none; cursor: grab }
.grab::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: var(--line) }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px 20px; overscroll-behavior: contain }
.sec { font-size: 12px; font-weight: 800; color: var(--ink-3); letter-spacing: .04em; margin: 12px 2px 6px; display: flex; justify-content: space-between; gap: 8px }
.sec select { font: inherit; font-weight: 700; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px }

/* 最近一站的大卡 */
.hero { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
  border-left: 6px solid var(--c); cursor: pointer }
.hero .k { font-size: 12px; font-weight: 800; color: var(--c) }
.hero .nm { font-weight: 800; font-size: 17px; line-height: 1.3 }
.hero .dist { grid-row: 1 / span 3; grid-column: 2; text-align: right; align-self: center }
.hero .dist b { font-size: 30px; line-height: 1; display: block }
.hero .meta { color: var(--ink-3); font-size: 13px }
.arrow { display: inline-block; transition: transform .4s ease; color: var(--ink-2) }

/* 清單 */
.list { display: flex; flex-direction: column; gap: 8px }
.item { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border-radius: 14px; padding: 10px 12px;
  border: 0; text-align: left; width: 100%; box-shadow: 0 1px 2px rgba(14,17,22,.05) }
.item.dim { opacity: .55 }
.badge { width: 40px; height: 40px; border-radius: 12px; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; line-height: 1;
  font-family: var(--num); text-align: center }
.badge small { display: block; font-size: 9px; font-weight: 700; opacity: .9; margin-top: 1px }
.badge.hollow { background: transparent; color: var(--c); box-shadow: inset 0 0 0 2px var(--c) }
.item .nm { font-weight: 700; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
.item .sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.item .r { text-align: right; font-size: 12px; color: var(--ink-3) }
.item .r b { font-size: 16px; color: var(--ink); display: block }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); margin-right: 4px }
.tag.ok { background: var(--ok-soft); color: var(--ok) } .tag.warn { background: var(--warn-soft); color: var(--warn) } .tag.bad { background: var(--bad-soft); color: var(--bad) }
.empty { text-align: center; color: var(--ink-3); padding: 24px 8px }
.note { font-size: 12px; color: var(--ink-3); margin: 14px 2px 0; line-height: 1.6 }
.note a { color: var(--accent) }

/* 詳細 */
.dhead { border-radius: 16px; padding: 14px; background: var(--c); color: #fff; position: relative }
.dhead .k { font-size: 12px; font-weight: 800; opacity: .92 }
.dhead h2 { margin: 2px 40px 4px 0; font-size: 19px; line-height: 1.3 }
.dhead .addr { font-size: 13px; opacity: .92 }
.dhead .x { position: absolute; right: 10px; top: 10px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,.22); color: #fff; font-size: 16px }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px }
.stat { background: var(--surface); border-radius: 12px; padding: 10px; text-align: center }
.stat b { display: block; font-size: 20px; line-height: 1.15 }
.stat span { font-size: 11.5px; color: var(--ink-3); font-weight: 700 }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px }
.btn { border: 0; border-radius: 12px; padding: 11px 10px; font-weight: 800; background: var(--surface); text-align: center; text-decoration: none; color: var(--ink);
  display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px }
.btn.primary { background: var(--accent); color: var(--on-accent); grid-column: 1 / -1 }
.card { background: var(--surface); border-radius: 14px; padding: 4px 14px; margin-top: 10px }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px }
.kv:last-child { border-bottom: 0 }
.kv > span:first-child { color: var(--ink-3); font-weight: 700; font-size: 13px }
.kv a { color: var(--accent); word-break: break-all }
.conn { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line) }
.conn:last-child { border-bottom: 0 }
.conn .ty { font-weight: 700 }
.conn .ty small { display: block; color: var(--ink-3); font-weight: 600; font-size: 12px }
.conn .kw { font-weight: 800; color: var(--c) }
.conn .q { color: var(--ink-3); font-weight: 700; min-width: 34px; text-align: right }

/* 設定 */
.panel { background: var(--surface); border-radius: 14px; padding: 12px 14px; margin-top: 10px }
.panel h3 { margin: 0 0 8px; font-size: 14px }
.seg { display: flex; flex-wrap: wrap; gap: 6px }
.seg button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 700; color: var(--ink-2) }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent) }
.panel input[type=text] { width: 100%; font: inherit; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink) }
.panel p { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3) }

/* 地圖上的標記 */
.pin { width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font: 800 11px/1 var(--num);
  border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .2s }
.pin.t { border-radius: 10px }
.pin.hollow { background: #fff; color: var(--c); border-color: var(--c); border-style: dashed }
.pin.dim { opacity: .45 }
.pin.sel { transform: scale(1.3); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 40%, transparent), 0 2px 8px rgba(0,0,0,.4) }
.me { width: 22px; height: 22px; position: relative }
.me .dot { position: absolute; inset: 3px; border-radius: 50%; background: #2B7CFF; border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(43,124,255,.6); animation: mepulse 2s infinite }
.me .cone { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-origin: 0 0; display: none }
.me .cone::before { content: ""; position: absolute; left: -14px; top: -40px; border-left: 14px solid transparent; border-right: 14px solid transparent; border-bottom: 34px solid rgba(43,124,255,.35) }
@keyframes mepulse { 0% { box-shadow: 0 0 0 0 rgba(43,124,255,.55) } 70% { box-shadow: 0 0 0 14px rgba(43,124,255,0) } 100% { box-shadow: 0 0 0 0 rgba(43,124,255,0) } }
.toast { position: fixed; z-index: 1000; left: 50%; transform: translateX(-50%); top: calc(110px + env(safe-area-inset-top, 0px)); background: var(--ink); color: var(--bg);
  padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; max-width: calc(100% - 32px); box-shadow: var(--shadow) }
.spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; flex: none }
@keyframes sp { to { transform: rotate(360deg) } }
</style>
</head>
<body>
<div id="map" aria-label="充電站地圖"></div>

<div class="top">
  <div class="row">
    <div class="pill status" id="status"><i class="live"></i><span class="t" id="statusText">準備定位…</span></div>
    <button class="pill iconbtn" id="btnRefresh" title="重新搜尋" aria-label="重新搜尋">⟳</button>
    <button class="pill iconbtn" id="btnSettings" title="設定與篩選" aria-label="設定與篩選">⚙︎</button>
  </div>
  <div class="chips" id="chips"></div>
  <button class="here" id="btnHere" hidden>搜尋這一區</button>
</div>

<button class="fab" id="btnLocate" title="回到我的位置" aria-label="回到我的位置">◎</button>

<section class="sheet" id="sheet">
  <div class="grab" id="grab"></div>
  <div class="scroll" id="scroll">
    <div id="viewList"></div>
    <div id="viewDetail" hidden></div>
    <div id="viewSettings" hidden></div>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<script src="./vendor/leaflet.js"></script>
<script>
"use strict";
/* ============ 設定與狀態 ============ */
const CATS = {
  tesla: { label: "特斯拉超充", short: "超充", v: "--c-tesla" },
  ultra: { label: "超快充 ≥150kW", short: "超快充", v: "--c-ultra" },
  fast:  { label: "快充 DC", short: "快充", v: "--c-fast" },
  slow:  { label: "慢充 AC", short: "慢充", v: "--c-slow" },
  unk:   { label: "規格不明", short: "不明", v: "--c-unk" },
};
const CONN = {  // 接頭名稱（OSM socket:* 與特斯拉資料的 plugs 共用）
  type2_combo: ["CCS2", "直流"], ccs2: ["CCS2", "直流"], type1_combo: ["CCS1", "直流"], ccs1: ["CCS1", "直流"],
  chademo: ["CHAdeMO", "直流"], tesla_supercharger: ["特斯拉超充接頭", "直流"], tpc: ["TPC 特斯拉專用", "直流"],
  nacs: ["NACS", "直流"], gb_dc: ["GB/T", "直流"], gbt: ["GB/T", "直流"], tesla_supercharger_ccs: ["CCS2", "直流"],
  type2: ["Type 2", "交流"], type2_cable: ["Type 2（附線）", "交流"], type1: ["J1772 Type 1", "交流"],
  tesla_destination: ["特斯拉目的地充電", "交流"], gb_ac: ["GB/T", "交流"], schuko: ["家用插座", "交流"], type3c: ["Type 3C", "交流"],
  multi: ["多接頭（同一樁 TPC／CCS2 等）", "直流"], other: ["其他／未分類接頭", "直流"],
};
const DC_KEYS = new Set(["other", "type2_combo", "ccs2", "type1_combo", "ccs1", "chademo", "tesla_supercharger", "tpc", "nacs", "gb_dc", "gbt", "tesla_supercharger_ccs", "multi"]);
const CONN_FILTERS = [["ccs2", "CCS2"], ["tpc", "TPC／NACS"], ["ccs1", "CCS1"], ["chademo", "CHAdeMO"], ["type2", "Type 2"], ["type1", "J1772"]];
const CONN_GROUP = { type2_combo: "ccs2", ccs2: "ccs2", tesla_supercharger_ccs: "ccs2", tpc: "tpc", nacs: "tpc", tesla_supercharger: "tpc",
  type1_combo: "ccs1", ccs1: "ccs1", chademo: "chademo", type2: "type2", type2_cable: "type2", tesla_destination: "type2", type1: "type1" };
const STATUS_TW = { OPEN: ["營運中", "ok"], CONSTRUCTION: ["建置中", "warn"], PERMIT: ["申請許可中", "warn"], PLAN: ["規劃中", "warn"],
  VOTING: ["社群提案", "warn"], CLOSED_TEMP: ["暫停營業", "bad"], EXPANDING: ["擴建中", "ok"], CLOSED_PERM: ["已關閉", "bad"] };

const store = {
  get(k, d) { try { const v = localStorage.getItem("ev." + k); return v == null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem("ev." + k, JSON.stringify(v)) } catch {} },
};
const S = {
  me: null, heading: null, acc: null, origin: null, radius: store.get("radius", 10),
  cats: new Set(store.get("cats", Object.keys(CATS))), conns: new Set(store.get("conns", [])),
  car: store.get("car", "any"), showPlanned: store.get("planned", false), ocmKey: store.get("ocmKey", ""),
  stations: [], selected: null, follow: true, loading: false, view: "list", sort: "dist",
  drive: new Map(), lastSearchAt: 0, lastTableAt: 0, lastTableFrom: null, route: null, routeFrom: null,
};
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ============ 工具 ============ */
function hav(a, b) {
  const R = 6371e3, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(a, b) {
  const r = Math.PI / 180, y = Math.sin((b.lng - a.lng) * r) * Math.cos(b.lat * r);
  const x = Math.cos(a.lat * r) * Math.sin(b.lat * r) - Math.sin(a.lat * r) * Math.cos(b.lat * r) * Math.cos((b.lng - a.lng) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
const fmtDist = (m) => m < 1000 ? `${Math.round(m / 10) * 10} m` : m < 10000 ? `${(m / 1000).toFixed(1)} km` : `${Math.round(m / 1000)} km`;
const fmtMin = (s) => s < 3600 ? `${Math.max(1, Math.round(s / 60))} 分` : `${Math.floor(s / 3600)} 小時 ${Math.round((s % 3600) / 60)} 分`;
const dirName = (b) => ["北", "東北", "東", "東南", "南", "西南", "西", "西北"][Math.round(b / 45) % 8];
function parseKW(v) {
  if (v == null) return null;
  let best = null;
  for (const part of String(v).split(/[;,/]/)) {
    const m = part.match(/([\d.]+)\s*(kw|w|kva)?/i); if (!m) continue;
    let n = parseFloat(m[1]); if (!isFinite(n)) continue;
    if (m[2] && m[2].toLowerCase() === "w") n /= 1000; else if (!m[2] && n > 1000) n /= 1000;
    if (n > 0 && n < 1500) best = Math.max(best ?? 0, n);
  }
  return best;
}
const kwTxt = (k) => k == null ? "—" : k >= 100 ? String(Math.round(k)) : String(Math.round(k * 10) / 10);

const OVERPASS = ["https://overpass-api.de/api/interpreter", "https://overpass.private.coffee/api/interpreter",

// 公用 Overpass 伺服器偶爾塞車：幾台同時查，誰先回就用誰；全部失敗時用上次查到的結果
async function loadOSM(c, radius) {
  const q = `[out:json][timeout:25];nwr["amenity"="charging_station"](around:${Math.round(radius * 1000)},${c.lat.toFixed(4)},${c.lng.toFixed(4)});out center tags;`;
  const acs = OVERPASS.map(() => new AbortController());
  const one = async (u, i) => {
    const t = setTimeout(() => acs[i].abort(), 30000);
    try {
      const r = await fetch(u + "?data=" + encodeURIComponent(q), { signal: acs[i].signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json(); if (!Array.isArray(j.elements)) throw new Error("格式不符"); return j.elements;
    } finally { clearTimeout(t) }
  };
  try {
    const el = await Promise.any(OVERPASS.map(one));
    acs.forEach((a) => a.abort());
    store.set("osmLast", { c, r: radius, t: Date.now(), el });
    return { el };
  } catch (e) {
    const last = store.get("osmLast", null);
    if (last && hav(last.c, c) < last.r * 1000) return { el: last.el, stale: last.t };
    throw new Error("OpenStreetMap 伺服器忙碌");

}

}

// 3) Open Charge Map（選用；在設定貼上自己的免費金鑰才會用）
async function loadOCM(c, radius) {
  if (!S.ocmKey) return [];
  const u = `https://api.openchargemap.io/v3/poi/?output=json&latitude=${c.lat}&longitude=${c.lng}&distance=${radius}&distanceunit=KM&maxresults=500&compact=false&verbose=false&key=${encodeURIComponent(S.ocmKey)}`;

function ocmKey(title = "", id) {

  if (s.includes("chademo")) return "chademo";
  if (s.includes("nacs") || s.includes("supercharger") || s.includes("tesla")) return "tpc";
  if (s.includes("type 2")) return "type2";

  const st = p.StatusType;
  return {
    id: "C" + p.ID, src: "ocm", ocmId: p.ID, lat: a.Latitude, lng: a.Longitude, cat, tesla: isTesla, dest: isTesla && !dc,
    name: a.Title || op || "充電站", operator: op, conns, kw, stalls: p.NumberOfPoints || conns.reduce((s, c) => s + (c.n || 0), 0) || null,
    addr: [a.AddressLine1, a.Town, a.StateOrProvince].filter(Boolean).join(", "), cost: p.UsageCost, usage: p.UsageType?.Title,

/* ============ 搜尋 ============ */
let teslaAll = null, searchSeq = 0;
async function search(center, why) {
  const seq = ++searchSeq;  // 新的搜尋蓋掉舊的
  S.loading = true; S.origin = { lat: center.lat, lng: center.lng }; S.lastSearchAt = Date.now(); S.drive.clear(); S.lastTableAt = 0; S.osmFail = false;
  $("btnHere").hidden = true;
  const radius = S.radius, R = radius * 1000;
  const osmP = loadOSM(center, radius), ocmP = loadOCM(center, radius);
  osmP.catch(() => {}); ocmP.catch(() => {});
  // 1) 特斯拉超充：資料在手機裡，先畫出來
  if (!teslaAll) teslaAll = await loadTesla();
  if (seq !== searchSeq) return;
  const tesla = teslaAll.filter((a) => hav(center, { lat: a[3], lng: a[4] }) <= R * 1.6).map(teslaToStation);
  S.stations = tesla.concat(S.stations.filter((s) => s.src !== "tesla")); render();  // 一般站先沿用上一次的，新的到了再換
  // 2) 一般充電站：OpenStreetMap＋（選用）Open Charge Map
  const [osm, ocm] = await Promise.allSettled([osmP, ocmP]);
  if (seq !== searchSeq) return;
  const out = tesla.slice();
  const teslaOsmIds = new Set(tesla.map((t) => t.osmId).filter(Boolean));
  const near = (s, list, m) => list.find((o) => o.cat === s.cat && hav(o, s) < m);
  let staleMsg = null;
  if (osm.status === "fulfilled") {
    if (osm.value.stale) staleMsg = `OpenStreetMap 忙碌，先顯示 ${Math.round((Date.now() - osm.value.stale) / 60000)} 分鐘前存下的資料`;
    for (const e of osm.value.el) {
      const s = osmToStation(e); if (!s) continue;
      if (teslaOsmIds.has(e.id)) { const t = tesla.find((x) => x.osmId === e.id); if (t) t.osmTags = s.tags; continue }
      if (s.cat === "tesla") { const t = near(s, tesla, 250); if (t) { t.osmTags = s.tags; continue } }
      out.push(s);
    }
  } else S.osmFail = true;
  if (ocm.status === "fulfilled") {
    for (const s of ocm.value) {
      const dup = s.cat === "tesla" ? near(s, tesla, 250) : out.find((o) => o.src === "osm" && hav(o, s) < 60);
      if (dup) { dup.ocm = s; if (dup.src === "osm" && s.conns.length) { dup.conns = s.conns; dup.kw = s.kw ?? dup.kw; dup.cat = s.cat } continue }
      out.push(s);
    }
  } else if (S.ocmKey) toast("Open Charge Map 讀取失敗：" + ocm.reason?.message, 5000);
  S.stations = out; S.loading = false;
  if (S.osmFail) toast("OpenStreetMap 伺服器忙碌，先顯示特斯拉站；稍後按 ⟳ 再試", 5000);
  else if (staleMsg) toast(staleMsg, 5000);
  else if (why) toast(why);
  if (S.selected) { const s = S.stations.find((x) => x.id === S.selected.id); if (s) S.selected = s }
  render(); updateDriveTimes(true);
}

      L.polyline(r.geometry.coordinates.map(([x, y]) => [y, x]), { color: "#fff", weight: 9, opacity: .9, interactive: false }),

async function updateDriveTimes(force) {

  if (!top.length) return;
  S.lastTableAt = Date.now(); S.lastTableFrom = { ...from };

    const j = await fetchJSON(`https://router.project-osrm.org/table/v1/driving/${coords}?sources=0&annotations=duration,distance`, {}, 20000);
    top.forEach((s, i) => { const t = j.durations?.[0]?.[i + 1], d = j.distances?.[0]?.[i + 1]; if (t != null) S.drive.set(s.id, { t, d }) });

let watchId = null;
function startGPS(user) {

  watchId = navigator.geolocation.watchPosition(onPos, (err) => {
    navigator.geolocation.clearWatch(watchId); watchId = null;
    noGPS(err.code === 1 ? "定位被拒絕：到瀏覽器設定允許位置，或拖曳地圖後按「搜尋這一區」" : "暫時拿不到位置，先用地圖中心搜尋");
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

  if (S.follow) map.setView([S.me.lat, S.me.lng], first ? 14 : map.getZoom(), { animate: !first });
  drawMe();

  g.addEventListener("pointermove", (e) => { if (y0 == null) return; const h = Math.min(innerHeight - 64, Math.max(90, h0 + (y0 - e.clientY))); sh.style.setProperty("--h", h + "px") });

  const sb = e.target.closest("[data-seg] button"); if (!sb) return;
  const seg = sb.parentElement.dataset.seg, v = sb.dataset.v;
  if (seg === "radius") { S.radius = +v; store.set("radius", S.radius); search(S.me || S.origin || map.getCenter()) }
  if (seg === "car") { S.car = v; store.set("car", v) }
  if (seg === "planned") { S.showPlanned = v === "true"; store.set("planned", S.showPlanned) }
  if (seg === "conns") { S.conns.has(v) ? S.conns.delete(v) : S.conns.add(v); store.set("conns", [...S.conns]) }
  if (seg === "theme") { if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; store.set("theme", v); setTiles() }
  renderSettings(); render();
});
$("scroll").addEventListener("change", (e) => {
  if (e.target.id === "sortSel") { S.sort = e.target.value; if (S.sort === "drive") updateDriveTimes(true); renderList() }
  if (e.target.id === "ocmKey") { S.ocmKey = e.target.value.trim(); store.set("ocmKey", S.ocmKey); if (S.origin) search(S.origin, S.ocmKey ? "已加入 Open Charge Map 資料" : null) }
});
$("btnSettings").addEventListener("click", () => { S.view = S.view === "settings" ? (S.selected ? "detail" : "list") : "settings"; renderSettings(); render(); $("scroll").scrollTop = 0; if (sheetState === "low") setSheet("mid") });
$("btnRefresh").addEventListener("click", () => { const c = S.me && S.follow ? S.me : map.getCenter(); search({ lat: c.lat, lng: c.lng }, "已重新整理") });
$("btnLocate").addEventListener("click", () => {
  S.follow = true; $("btnLocate").classList.add("follow");
  if (S.me) { map.setView([S.me.lat, S.me.lng], Math.max(map.getZoom(), 14)); if (hav(S.origin || S.me, S.me) > 500) search(S.me) } else startGPS(true);
});
$("btnHere").addEventListener("click", () => { const c = map.getCenter(); search({ lat: c.lat, lng: c.lng }) });
map.on("dragstart", () => { S.follow = false; $("btnLocate").classList.remove("follow") });
map.on("moveend", () => {
  if (!S.origin) return; const c = map.getCenter();
  $("btnHere").hidden = S.loading || hav(S.origin, { lat: c.lat, lng: c.lng }) < S.radius * 1000 * 0.5;
});

/* ============ 啟動 ============ */
(() => { const th = store.get("theme", ""); if (th) { document.documentElement.dataset.theme = th; setTiles() } })();
setSheet(innerHeight < 640 ? "low" : "mid");
render();
startGPS(false);
loadTesla().then((d) => { teslaAll = d });
</script>
</body>
</html>
